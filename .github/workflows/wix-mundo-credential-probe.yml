name: Wix MUNDO credential probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wix-mundo-credential-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOKEN_A: ${{ secrets.WIX_MUNDO_API_KEY }}
      TOKEN_B: ${{ secrets.WIX_GABI_RADAR_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOKEN_A:-}" ]; then
            echo "WIX_MUNDO_API_KEY=FOUND"
          else
            echo "WIX_MUNDO_API_KEY=MISSING"
          fi
          if [ -n "${TOKEN_B:-}" ]; then
            echo "WIX_GABI_RADAR_API_KEY=FOUND"
          else
            echo "WIX_GABI_RADAR_API_KEY=MISSING"
          fi
