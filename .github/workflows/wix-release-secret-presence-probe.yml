name: Wix Release Secret Presence Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/wix-release-secret-presence-trigger.json'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      A: ${{ secrets.WIX_OS_API_KEY }}
      B: ${{ secrets.WIX_MUNDO_API_KEY }}
      C: ${{ secrets.WIX_API_KEY }}
      D: ${{ secrets.WIX_CLI_API_KEY }}
      E: ${{ secrets.WIX_RELEASE_API_KEY }}
      F: ${{ secrets.MUNDINHO_WIX_API_KEY }}
    steps:
      - name: Report names only
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in A B C D E F; do
            v="${!name:-}"
            if [ -n "$v" ]; then
              echo "WIX_RELEASE_SECRET_PRESENT=$name"
              found=1
            fi
          done
          if [ "$found" = "0" ]; then
            echo "WIX_RELEASE_SECRET_PRESENT=NONE"
          fi
