name: Radar Gabi · ORBI Runtime Probe
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radar-gabi-orbi-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser probe
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund >/dev/null
          npx playwright install chromium >/dev/null
      - name: Inspect live Gabi ORBI behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            await page.addInitScript(()=>{
              class FakeRecognition {
                constructor(){this.lang='';this.interimResults=false;this.continuous=false;this.maxAlternatives=1}
                start(){setTimeout(()=>this.onstart?.(),0)}
                abort(){setTimeout(()=>this.onend?.(),0)}
              }
              window.SpeechRecognition=FakeRecognition;
              window.webkitSpeechRecognition=FakeRecognition;
              navigator.mediaDevices={getUserMedia:async()=>({getTracks:()=>[{stop(){}}]})};
              window.SpeechSynthesisUtterance=function(text){this.text=text;this.lang='';this.rate=1;this.pitch=1;this.volume=1;this.voice=null};
              const voices=[{name:'Google português do Brasil',lang:'pt-BR',localService:true}];
              const synth={
                speaking:false,
                getVoices:()=>voices,
                cancel(){this.speaking=false},
                speak(u){this.speaking=true;setTimeout(()=>u.onstart?.(),0);setTimeout(()=>{this.speaking=false;u.onend?.()},220)}
              };
              Object.defineProperty(window,'speechSynthesis',{value:synth,configurable:true});
            });
            const res=await page.goto('https://radar.gabi.mundinhocomunicacao.com/',{waitUntil:'networkidle',timeout:45000});
            await page.click('[data-tab="studio"]');
            await page.waitForTimeout(150);
            const snap=async(label)=> {
              const v=await page.evaluate(()=>{
                const orb=document.querySelector('#gabiDivaOrb');
                const stage=document.querySelector('.gabiOrbPresence');
                const mic=document.querySelector('#gabiStudioMicMute');
                const stop=document.querySelector('#gabiStudioStop');
                return {
                  orbClass:orb?.className,
                  orbState:orb?.dataset.state,
                  stageState:stage?.dataset.state,
                  label:document.querySelector('#gabiStudioPresenceLabel')?.textContent,
                  micPressed:mic?.getAttribute('aria-pressed'),
                  micText:mic?.textContent,
                  stopDisabled:stop?.disabled,
                  conversationOpen:typeof gabiStudioConversationOpen!=='undefined'?gabiStudioConversationOpen:null
                };
              });
              console.log(label+'='+JSON.stringify(v));
            };
            console.log('HTTP='+res.status());
            await snap('IDLE');
            await page.click('#gabiDivaOrb');
            await page.waitForTimeout(80);
            await snap('AFTER_ORB_CLICK');
            await page.evaluate(()=>gabiStudioSpeak('Teste curto de voz natural.'));
            await page.waitForTimeout(60);
            await snap('DURING_SPEAK');
            await page.click('#gabiDivaOrb');
            await page.waitForTimeout(80);
            await snap('AFTER_BARGE_IN');
            await page.click('#gabiStudioMicMute');
            await page.waitForTimeout(30);
            await snap('MUTED');
            await page.click('#gabiStudioMicMute');
            await page.waitForTimeout(30);
            await snap('UNMUTED');
            await page.click('#gabiStudioStop');
            await page.waitForTimeout(80);
            await snap('AFTER_STOP');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
