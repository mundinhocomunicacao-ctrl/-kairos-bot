name: Radar Gabi · ORBI Runtime Probe
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radar-gabi-orbi-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser probe
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund >/dev/null
          npx playwright install chromium >/dev/null
      - name: Inspect live Gabi ORBI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const logs=[];
            page.on('console',m=>logs.push(m.type()+':'+m.text()));
            const res=await page.goto('https://radar.gabi.mundinhocomunicacao.com/',{waitUntil:'networkidle',timeout:45000});
            const data=await page.evaluate(()=>{
              const orb=document.querySelector('#gabiDivaOrb');
              const stage=document.querySelector('.gabiOrbPresence');
              const core=document.querySelector('#gabiDivaOrb .divaOrbCore');
              const halo=document.querySelector('#gabiDivaOrb .divaOrbHalo');
              if(!orb)return {missing:true};
              const r=orb.getBoundingClientRect();
              const cr=core?.getBoundingClientRect();
              const hr=halo?.getBoundingClientRect();
              const os=getComputedStyle(orb),cs=core?getComputedStyle(core):null,hs=halo?getComputedStyle(halo):null;
              return {
                missing:false,
                httpTitle:document.title,
                orb:{x:r.x,y:r.y,w:r.width,h:r.height,display:os.display,opacity:os.opacity,visibility:os.visibility,className:orb.className,state:orb.dataset.state},
                core:cr&&{x:cr.x,y:cr.y,w:cr.width,h:cr.height,background:cs.backgroundImage,boxShadow:cs.boxShadow,animation:cs.animationName},
                halo:hr&&{x:hr.x,y:hr.y,w:hr.width,h:hr.height,background:hs.backgroundImage,animation:hs.animationName,transform:hs.transform},
                stage:stage&&{state:stage.dataset.state,rect:(()=>{const q=stage.getBoundingClientRect();return {x:q.x,y:q.y,w:q.width,h:q.height}})()},
                label:document.querySelector('#gabiStudioPresenceLabel')?.textContent,
                menu:[...document.querySelectorAll('.gabiOrbiMenu button')].map(x=>({id:x.id,text:x.textContent,disabled:x.disabled}))
              };
            });
            console.log('HTTP='+res.status());
            console.log('ORBI='+JSON.stringify(data));
            console.log('CONSOLE='+JSON.stringify(logs.slice(-30)));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
