name: OS private source credential probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/os-private-source-credential-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      S01: ${{ secrets.GH_TOKEN }}
      S02: ${{ secrets.GH_PAT }}
      S03: ${{ secrets.GITHUB_PAT }}
      S04: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
      S05: ${{ secrets.MUNDINHO_GITHUB_TOKEN }}
      S06: ${{ secrets.MUNDINHO_GH_TOKEN }}
      S07: ${{ secrets.OS_GITHUB_TOKEN }}
      S08: ${{ secrets.OS_REPO_TOKEN }}
      S09: ${{ secrets.PRIVATE_REPO_TOKEN }}
      S10: ${{ secrets.REPO_ACCESS_TOKEN }}
      S11: ${{ secrets.GH_APP_TOKEN }}
      S12: ${{ secrets.GITHUB_APP_TOKEN }}
      S13: ${{ secrets.GITHUB_APP_ID }}
      S14: ${{ secrets.GH_APP_ID }}
      S15: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      S16: ${{ secrets.GH_APP_PRIVATE_KEY }}
      S17: ${{ secrets.GITLAB_PRIVATE_TOKEN }}
      S18: ${{ secrets.GITLAB_PROJECT_TOKEN }}
      S19: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
      S20: ${{ secrets.GITLAB_RUNNER_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          names=(GH_TOKEN GH_PAT GITHUB_PAT GITHUB_PERSONAL_ACCESS_TOKEN MUNDINHO_GITHUB_TOKEN MUNDINHO_GH_TOKEN OS_GITHUB_TOKEN OS_REPO_TOKEN PRIVATE_REPO_TOKEN REPO_ACCESS_TOKEN GH_APP_TOKEN GITHUB_APP_TOKEN GITHUB_APP_ID GH_APP_ID GITHUB_APP_PRIVATE_KEY GH_APP_PRIVATE_KEY GITLAB_PRIVATE_TOKEN GITLAB_PROJECT_TOKEN GITLAB_DEPLOY_TOKEN GITLAB_RUNNER_TOKEN)
          for i in $(seq -w 1 20); do
            var="S$i"
            idx=$((10#$i-1))
            if [ -n "${!var:-}" ]; then echo "${names[$idx]}=AVAILABLE"; else echo "${names[$idx]}=MISSING"; fi
          done
