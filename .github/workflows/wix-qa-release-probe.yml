name: Mundinho Wix QA Release Probe
on:
  push:
    branches:
      - forge/wix-remote-release-auth-20260927
  workflow_dispatch:
jobs:
  wix-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Build exact approved OS artifact
        working-directory: os
        env:
          MUNDO_RUNTIME_SOURCE_SHA: be822ffc6353237a413222ea036bf6eabc45f8e4
          MUNDO_RUNTIME_ENV: wix-qa
        run: |
          npm ci
          npm run build:wix-worker
          test -f dist/wix-server/entry.mjs
          grep -F "$MUNDO_RUNTIME_SOURCE_SHA" dist/wix-server/entry.mjs
      - name: Prepare Wix release package
        shell: bash
        run: |
          rm -rf .wix-qa-release
          mkdir -p .wix-qa-release
          cp -R os/dist/client .wix-qa-release/client
          cp -R os/dist/wix-server .wix-qa-release/server
          cat > .wix-qa-release/wix.config.json <<'JSON'
          {
            "projectType": "Site",
            "appId": "8fabf7a9-b3c7-43af-ab51-e37968937afb",
            "siteId": "242b9d6f-71ad-40c6-b1d7-f1f0825e01be",
            "site": {
              "outputDirectory": {
                "client": "./client",
                "server": "./server"
              }
            }
          }
          JSON
      - name: Authenticate and release to Wix QA
        working-directory: .wix-qa-release
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          KEY="${WIX_API_KEY:-${WIX_CLI_API_KEY:-}}"
          test -n "$KEY" || { echo "WIX_CI_CREDENTIAL_MISSING"; exit 78; }
          npx --yes @wix/cli@latest login --api-key "$KEY"
          npx --yes @wix/cli@latest whoami
          npx --yes @wix/cli@latest release --comment "DIVA mass-unblock QA be822ffc"
