name: Mundinho Wix QA Release Probe
on:
  push:
    branches:
      - forge/wix-remote-release-auth-20260927
  workflow_dispatch:
jobs:
  wix-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact clean OS artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3             https://mundinho-os-current-be822-artifact-v2.onrender.com/artifact             --output /tmp/os-current-be822.tar.gz
          rm -rf /tmp/os-current-be822
          mkdir -p /tmp/os-current-be822
          tar -xzf /tmp/os-current-be822.tar.gz -C /tmp/os-current-be822
          test -f /tmp/os-current-be822/dist/wix-server/entry.mjs
          grep -F be822ffc6353237a413222ea036bf6eabc45f8e4 /tmp/os-current-be822/dist/wix-server/entry.mjs
      - name: Prepare Wix release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wix-qa-release
          mkdir -p .wix-qa-release
          cp -R /tmp/os-current-be822/dist/client .wix-qa-release/client
          cp -R /tmp/os-current-be822/dist/wix-server .wix-qa-release/server
          cat > .wix-qa-release/wix.config.json <<'JSON'
          {
            "projectType": "Site",
            "appId": "8fabf7a9-b3c7-43af-ab51-e37968937afb",
            "siteId": "242b9d6f-71ad-40c6-b1d7-f1f0825e01be",
            "site": {
              "outputDirectory": {
                "client": "./client",
                "server": "./server"
              }
            }
          }
          JSON
      - name: Authenticate and release to Wix QA
        working-directory: .wix-qa-release
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          set -euo pipefail
          KEY="${WIX_API_KEY:-${WIX_CLI_API_KEY:-}}"
          test -n "$KEY" || { echo "WIX_CI_CREDENTIAL_MISSING"; exit 78; }
          npx --yes @wix/cli@latest login --api-key "$KEY"
          npx --yes @wix/cli@latest whoami
          npx --yes @wix/cli@latest release --comment "DIVA mass-unblock QA be822ffc"
