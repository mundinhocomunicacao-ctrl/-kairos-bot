name: Wix CLI Auth Internals Probe
on:
  push:
    branches: ['forge/wix-remote-release-auth-20260927']
    paths: ['.github/workflows/wix-cli-auth-internals-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect packaged Wix CLI auth surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wixprobe && cd /tmp/wixprobe
          npm init -y >/dev/null 2>&1
          npm install --silent @wix/cli@latest
          echo '=== AUTH PACKAGES ==='
          find node_modules -maxdepth 3 -type d | grep -E '@wix/(cli-auth|cli)' | head -80 || true
          echo '=== ENV / TOKEN REFERENCES ==='
          grep -RInE 'process\.env\.|WIX_[A-Z0-9_]+|apiKey|accessToken|refreshToken|deviceCode|account-auth-strategy|Authorization' node_modules/@wix node_modules/.pnpm 2>/dev/null |             grep -E 'cli-auth|@wix/cli|login|auth-strateg' |             sed -E 's/(token|secret|key)[=:][^ ,}]+/\1=[REDACTED]/gi' | head -500 || true
