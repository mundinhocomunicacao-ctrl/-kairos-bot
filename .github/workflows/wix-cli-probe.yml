name: Wix CLI deployment probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wix-cli-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe governed Wix credential
        env:
          A1: ${{ secrets.WIX_API_KEY }}
          A2: ${{ secrets.WIX_CLI_API_KEY }}
          A3: ${{ secrets.WIX_RELEASE_API_KEY }}
          A4: ${{ secrets.WIX_MUNDO_API_KEY }}
          A5: ${{ secrets.MUNDINHO_WIX_API_KEY }}
          A6: ${{ secrets.WIX_GABI_RADAR_API_KEY }}
          A7: ${{ secrets.MUNDO_WIX_API_KEY }}
          A8: ${{ secrets.WIX_ACCOUNT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/radar-gabi/diagnostics
          names=(WIX_API_KEY WIX_CLI_API_KEY WIX_RELEASE_API_KEY WIX_MUNDO_API_KEY MUNDINHO_WIX_API_KEY WIX_GABI_RADAR_API_KEY MUNDO_WIX_API_KEY WIX_ACCOUNT_API_KEY)
          vals=("$A1" "$A2" "$A3" "$A4" "$A5" "$A6" "$A7" "$A8")
          found=0
          alias_name=""
          {
            echo "WIX_CREDENTIAL_PROBE_V1"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in "${!names[@]}"; do
              if [ -n "${vals[$i]}" ]; then
                echo "PRESENT:${names[$i]}"
                if [ "$found" = "0" ]; then
                  printf '%s' "${vals[$i]}" > /tmp/wix-governed.key
                  chmod 600 /tmp/wix-governed.key
                  alias_name="${names[$i]}"
                fi
                found=1
              else
                echo "ABSENT:${names[$i]}"
              fi
            done
            echo "ANY_PRESENT=$found"
            echo "SELECTED_ALIAS=${alias_name:-none}"
          } > deploy/radar-gabi/diagnostics/wix-credential-probe.txt

          if [ "$found" = "1" ]; then
            WIX_KEY="$(cat /tmp/wix-governed.key)"
            if CI=1 npx @wix/cli@latest login --api-key "$WIX_KEY" >/tmp/wix-login.out 2>&1 && CI=1 npx @wix/cli@latest whoami >/tmp/wix-whoami.out 2>&1; then
              echo "WIX_CLI_AUTH=PASS" >> deploy/radar-gabi/diagnostics/wix-credential-probe.txt
              sed -E 's/(api[-_ ]?key|token)[=: ]+[^ ]+/[REDACTED]/gi' /tmp/wix-whoami.out | head -50 >> deploy/radar-gabi/diagnostics/wix-credential-probe.txt
            else
              echo "WIX_CLI_AUTH=FAIL" >> deploy/radar-gabi/diagnostics/wix-credential-probe.txt
            fi
            shred -u /tmp/wix-governed.key || rm -f /tmp/wix-governed.key
          else
            echo "WIX_CLI_AUTH=NOT_ATTEMPTED" >> deploy/radar-gabi/diagnostics/wix-credential-probe.txt
          fi
          cat deploy/radar-gabi/diagnostics/wix-credential-probe.txt

      - name: Extract Wix CLI deployment internals
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wix-cli-probe
          mkdir -p /tmp/wix-cli-probe/out
          cd /tmp/wix-cli-probe
          npm pack @wix/cli@1.1.247 >/tmp/wix-cli-pack-name.txt
          PKG="$(cat /tmp/wix-cli-pack-name.txt | tail -1)"
          tar -xzf "$PKG"
          {
            echo "# Wix CLI 1.1.247 deployment internals"
            echo
            echo "## Direct deployment-related literals"
            grep -R -n -E 'wixstro|STATICS_UPLOAD_PENDING|DEPLOY_SUCCESS|KUBERNETES|uploadAuthToken|staticsCompletionToken|deployment|override|release' package/build --include='*.js' | head -1200 || true
            echo
            echo "## URL-like literals around deployment code"
            grep -R -n -E 'https://[^"[:space:]]+|/[^"[:space:]]*(deployment|statics|release|override)[^"[:space:]]*' package/build --include='*.js' | head -1200 || true
            echo
            echo "## Selected file: src-RAK4XJCX.js"
            sed -n '400,620p' package/build/src-RAK4XJCX.js || true
            echo
            echo "## Selected file: chunk-MKII26WK.js"
            sed -n '1,180p' package/build/chunk-MKII26WK.js || true
            echo
            echo "## Selected file: chunk-EJB7C7MD.js"
            sed -n '1,220p' package/build/chunk-EJB7C7MD.js || true
            echo
            echo "## Selected file: ReleaseCommand-HIDXLX7H.js"
            sed -n '120,980p' package/build/ReleaseCommand-HIDXLX7H.js || true
            echo
            echo "## Selected deep range: chunk-EJB7C7MD.js"
            sed -n '360,640p' package/build/chunk-EJB7C7MD.js || true
            echo
            echo "## Selected file: chunk-WXY2WBU6.js"
            sed -n '1,240p' package/build/chunk-WXY2WBU6.js || true
            echo
            echo "## Selected file: chunk-737RXJMC.js"
            sed -n '160,340p' package/build/chunk-737RXJMC.js || true
          } > /tmp/wix-cli-probe/out/probe.txt
          cd "$GITHUB_WORKSPACE"
          mkdir -p deploy/radar-gabi/diagnostics
          cp /tmp/wix-cli-probe/out/probe.txt deploy/radar-gabi/diagnostics/wix-cli-deployment-probe.txt
          {
            echo "index_bytes=$(wc -c < deploy/radar-gabi/index.html | tr -d ' ')"
            echo "index_md5=$(md5sum deploy/radar-gabi/index.html | awk '{print $1}')"
            echo "index_sha1=$(sha1sum deploy/radar-gabi/index.html | awk '{print $1}')"
            echo "index_sha256=$(sha256sum deploy/radar-gabi/index.html | awk '{print $1}')"
            echo "content_type=text/html"
            echo
            echo "## staticFilesMetadata contexts"
            cd /tmp/wix-cli-probe
            grep -R -n -C 18 'staticFilesMetadata' package/build --include='*.js' | head -1200 || true
            echo
            echo "## preview/component override creation contexts"
            grep -R -n -C 70 -E 'useCreatePreview|previewId|componentOverrideId|createComponentOverride|versionOverrideId|updateDeploymentTopology' package/build --include='*.js' | head -2600 || true
            echo
            echo "## Astro PreviewCommand core"
            grep -n -C 140 -E 'previewId|componentOverride|deploymentBaseUrl|createAppDeployment|completeAppDeployment|onPreviewCreated' package/build/chunk-UXLEQMZC.js | head -2600 || true
            echo
            echo "## DevCenter override client exact"
            grep -n -C 120 -E 'createComponentsOverride|updateOverrideWithNoSideEffects|updateComponentsOverrides|OverrideType|componentOverrideId' package/build/chunk-D7ORRBCE.js | head -3600 || true
            echo
            echo "## Manifest processing exact"
            grep -R -n -C 100 -E 'function updateManifestWithBackendWorker|updateManifestWithBackendWorker =|function processAppManifest|processAppManifest =|BACKEND_WORKER' package/build --include='*.js' | head -5200 || true
          } > "$GITHUB_WORKSPACE/deploy/radar-gabi/diagnostics/wix-deploy-manifest.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/radar-gabi/diagnostics/wix-cli-deployment-probe.txt deploy/radar-gabi/diagnostics/wix-deploy-manifest.txt deploy/radar-gabi/diagnostics/wix-credential-probe.txt
          git commit -m "diag(wix): extract deployment internals from CLI" || true
          git push origin HEAD:main || true
