name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect modified component conversion
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          F="$TMP/node_modules/@wix/cli/build/chunk-WWWORPQF.js"
          echo '=== MODIFIED COMPONENT CONVERSION ==='
          grep -n 'toModifiedComponents' "$F" | head -20
          for n in $(grep -n 'toModifiedComponents' "$F" | cut -d: -f1 | head -20); do
            s=$((n-80)); [ $s -lt 1 ] && s=1; e=$((n+140)); sed -n "${s},${e}p" "$F"; echo '---';
          done
          echo '=== REQUEST DEFS ==='
          sed -n '640,730p' "$F"
