name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Wix override public path and releaseAppId
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          ROOT="$TMP/node_modules/@wix/cli/build"
          F="$ROOT/chunk-WWWORPQF.js"
          echo '=== OVERRIDE RESOLVER ==='
          sed -n '990,1055p' "$F"
          echo '=== RELEASE APP ID ==='
          grep -R -n -B30 -A50 'releaseAppId' "$ROOT" --include='*.js' | head -900 || true
          echo '=== MODIFIED COMPONENTS ==='
          grep -R -n -B35 -A80 'function toModifiedComponents\|const toModifiedComponents\|var toModifiedComponents' "$ROOT" --include='*.js' | head -900 || true
