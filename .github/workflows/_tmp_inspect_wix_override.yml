name: TMP Inspect Wix Deployment Read Contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Wix app deployment read/list contract
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund >/dev/null
          ROOT="$TMP/node_modules/@wix/cli/build"
          grep -R -n -B70 -A140 'GetAppDeployment\|ListAppDeployment\|listAppDeployment\|getAppDeployment' "$ROOT" --include='*.js' | head -2600 || true
