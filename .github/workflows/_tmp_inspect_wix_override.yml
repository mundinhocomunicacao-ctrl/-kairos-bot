name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Wix override create method
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          F="$TMP/node_modules/@wix/cli/build/chunk-WWWORPQF.js"
          echo '=== HTTP CREATE OVERRIDE ==='
          sed -n '1035,1410p' "$F"
          echo '=== CLIENT CREATE OVERRIDE ==='
          sed -n '5190,5265p' "$F"
