name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Wix CLI Site release path
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          ROOT="$TMP/node_modules/@wix/cli/build"
          echo '=== RELEASE SITE ==='
          grep -R -n -B180 -A320 'ReleaseSite' "$ROOT" --include='*.js' | head -2200 || true
          echo '=== SITE PROJECT RELEASE CALLS ==='
          grep -R -n -B120 -A220 'projectType.*Site\|releaseSite\|publishSite\|siteId.*release\|useBackendAsAServiceClient' "$ROOT" --include='*.js' | head -2600 || true
          echo '=== HOSTING / BACKEND AS A SERVICE ==='
          grep -R -n -B120 -A220 'backend-as-a-service\|BackendAsAService\|createDeployment\|deploymentUrl\|wix-site-host' "$ROOT" --include='*.js' | head -2600 || true
