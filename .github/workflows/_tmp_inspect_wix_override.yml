name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Wix Site topology contract
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          ROOT="$TMP/node_modules/@wix/cli/build"
          F="$ROOT/chunk-WWWORPQF.js"
          echo '=== SYMBOL LOCATIONS ==='
          grep -n 'useUpdateDeploymentTopologyForSite\|updateDeploymentTopologyForSite\|deployment-topology\|versionOverrideId' "$F" || true
          echo '=== FILE CONTEXT ==='
          grep -n -B120 -A220 'useUpdateDeploymentTopologyForSite' "$F" || true
          echo '=== TOPOLOGY CONTEXT ==='
          grep -n -B120 -A220 'versionOverrideId' "$F" || true
          echo '=== RELEASE API CONTRACT ==='
          grep -R -n -B120 -A180 'function release(payload)\|methodFqn:.*Release\|releaseBaseUrl' "$ROOT/ReleaseCommand-"*.js | head -1500 || true
