name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Wix BaaS project routing contract
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          ROOT="$TMP/node_modules/@wix/cli/build"
          echo '=== BAAS CLIENT SYMBOLS ==='
          grep -R -n -B80 -A180 'BackendAsAServiceClient\|getAppProject\|useBackendAsAServiceClient\|customDomain' "$ROOT" --include='*.js' | head -2600 || true
          echo '=== BAAS HTTP ENDPOINTS ==='
          grep -R -n -B100 -A220 'app-project\|appProject\|custom-domain\|customDomain\|backend-as-a-service' "$ROOT" --include='*.js' | head -3200 || true
