name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect minimal override payload
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          F="$TMP/node_modules/@wix/cli/build/chunk-WWWORPQF.js"
          echo '=== REQUEST TYPE DEFINITIONS ==='
          grep -n '_createComponentsOverrideRequest\|_componentsOverride =' "$F" | head -20
          for n in $(grep -n '_createComponentsOverrideRequest\|_componentsOverride =' "$F" | cut -d: -f1 | head -10); do
            s=$((n-35)); [ $s -lt 1 ] && s=1; e=$((n+90)); sed -n "${s},${e}p" "$F"; echo '---';
          done
          echo '=== CLIENT METHODS ==='
          grep -n 'createComponentsOverride =\|createComponentsOverride:' "$F" | head -20
          for n in $(grep -n 'createComponentsOverride =\|createComponentsOverride:' "$F" | cut -d: -f1 | head -10); do
            s=$((n-35)); [ $s -lt 1 ] && s=1; e=$((n+120)); sed -n "${s},${e}p" "$F"; echo '---';
          done
