name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact override client
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          ROOT="$TMP/node_modules/@wix/cli/build"
          echo '=== OVERRIDE CLIENT SYMBOLS ==='
          grep -R -n -B100 -A260 'createComponentsOverride' "$ROOT" --include='*.js' | head -2200 || true
          echo '=== OVERRIDE ENDPOINTS ==='
          grep -R -n -B100 -A260 'component-overrides\|components-overrides\|override.*no.*side.*effects\|Create.*Override' "$ROOT" --include='*.js' | head -2200 || true
