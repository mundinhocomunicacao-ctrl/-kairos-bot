name: TMP Inspect Wix Override Contract
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp_inspect_wix_override.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Site releaseAppId
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm install --prefix "$TMP" @wix/cli@latest --no-audit --no-fund
          ROOT="$TMP/node_modules/@wix/cli/build"
          echo '=== releaseAppId assignments ==='
          grep -R -n -B80 -A120 'releaseAppId' "$ROOT" --include='*.js' | head -2400 || true
