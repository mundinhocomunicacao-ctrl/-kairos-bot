name: Radar Gabi · Signed Upload Relay

on:
  push:
    branches: [main]
    paths:
      - "deploy/radar-gabi/secure-upload/request-*.txt"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^deploy/radar-gabi/secure-upload/request-.*\.txt$' | head -1)"
          test -n "$REQUEST_FILE"
          REQUEST_ID="$(basename "$REQUEST_FILE" .txt | sed 's/^request-//')"
          echo "id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Create ephemeral key and publish public half
        shell: bash
        env:
          REQUEST_ID: ${{ steps.req.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/radar-relay deploy/radar-gabi/secure-upload
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/radar-relay/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/radar-relay/private.pem -pubout -out "deploy/radar-gabi/secure-upload/public-$REQUEST_ID.pem" >/dev/null 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "deploy/radar-gabi/secure-upload/public-$REQUEST_ID.pem"
          git commit -m "relay(radar): publish ephemeral upload key $REQUEST_ID"
          git push origin HEAD:main

      - name: Wait for encrypted signed URL
        shell: bash
        env:
          REQUEST_ID: ${{ steps.req.outputs.id }}
        run: |
          set -euo pipefail
          KEY_ENC_B64="deploy/radar-gabi/secure-upload/key-$REQUEST_ID.b64"
          URL_ENC_B64="deploy/radar-gabi/secure-upload/url-$REQUEST_ID.b64"
          IV_FILE="deploy/radar-gabi/secure-upload/iv-$REQUEST_ID.txt"
          for i in $(seq 1 90); do
            git pull --ff-only origin main >/dev/null 2>&1 || true
            if [ -s "$KEY_ENC_B64" ] && [ -s "$URL_ENC_B64" ] && [ -s "$IV_FILE" ]; then
              base64 -d "$KEY_ENC_B64" > /tmp/radar-relay/key.enc
              base64 -d "$URL_ENC_B64" > /tmp/radar-relay/url.enc
              openssl pkeyutl -decrypt -inkey /tmp/radar-relay/private.pem -in /tmp/radar-relay/key.enc -out /tmp/radar-relay/aes.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
              KEY_HEX="$(xxd -p /tmp/radar-relay/aes.key | tr -d '\n')"
              IV_HEX="$(tr -d '\n\r ' < "$IV_FILE")"
              openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in /tmp/radar-relay/url.enc -out /tmp/radar-relay/upload-url.txt
              exit 0
            fi
            sleep 5
          done
          echo "RADAR_SIGNED_URL_TIMEOUT"
          exit 1

      - name: Upload exact Radar bundle
        shell: bash
        run: |
          set -euo pipefail
          cat relay-v4/chunk-*.txt > /tmp/radar-v4.html
          test "$(wc -c < /tmp/radar-v4.html | tr -d ' ')" = "162184"
          test "$(md5sum /tmp/radar-v4.html | awk '{print $1}')" = "57ef9be97ec842dced1312f0e31c169c"
          curl --fail --silent --show-error -X PUT -H "Content-Type: text/html" --data-binary @/tmp/radar-v4.html "$(cat /tmp/radar-relay/upload-url.txt)"
          echo "RADAR_SIGNED_UPLOAD=PASS"

      - name: Record result without secret material
        if: always()
        shell: bash
        env:
          REQUEST_ID: ${{ steps.req.outputs.id }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main >/dev/null 2>&1 || true
          STATUS="FAIL"
          if [ "${{ job.status }}" = "success" ]; then STATUS="PASS"; fi
          printf '%s\n' "$STATUS" > "deploy/radar-gabi/secure-upload/result-$REQUEST_ID.txt"
          git add "deploy/radar-gabi/secure-upload/result-$REQUEST_ID.txt"
          git commit -m "relay(radar): upload result $REQUEST_ID $STATUS" || true
          git push origin HEAD:main || true
