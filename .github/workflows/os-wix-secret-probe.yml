name: Mundinho OS · Wix Secret Probe

on:
  push:
    branches: [ops/os-wix-secret-probe-20260927]
    paths:
      - ".github/workflows/os-wix-secret-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WIX_RELEASE_API_KEY: ${{ secrets.WIX_RELEASE_API_KEY }}
      WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
      WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
      MUNDINHO_WIX_API_KEY: ${{ secrets.MUNDINHO_WIX_API_KEY }}
      WIX_MUNDO_API_KEY: ${{ secrets.WIX_MUNDO_API_KEY }}
      WIX_GABI_RADAR_API_KEY: ${{ secrets.WIX_GABI_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/os-wix-secret-probe-20260927
      - name: Probe aliases without revealing values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/os-wix-bridge/diagnostics
          {
            for key in WIX_RELEASE_API_KEY WIX_CLI_API_KEY WIX_API_KEY MUNDINHO_WIX_API_KEY WIX_MUNDO_API_KEY WIX_GABI_RADAR_API_KEY; do
              if [ -n "${!key:-}" ]; then
                echo "$key=AVAILABLE"
              else
                echo "$key=MISSING"
              fi
            done
          } > deploy/os-wix-bridge/diagnostics/secret-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/os-wix-bridge/diagnostics/secret-probe.txt
          git commit -m "diag(os): record Wix secret availability" || true
          git push origin HEAD:ops/os-wix-secret-probe-20260927
