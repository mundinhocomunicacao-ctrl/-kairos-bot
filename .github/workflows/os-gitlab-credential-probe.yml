name: OS GitLab credential probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/os-gitlab-credential-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN_A: ${{ secrets.GITLAB_TOKEN }}
      TOKEN_B: ${{ secrets.GITLAB_PAT }}
      TOKEN_C: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      TOKEN_D: ${{ secrets.MUNDINHO_GITLAB_TOKEN }}
      TOKEN_E: ${{ secrets.GITLAB_API_TOKEN }}
    steps:
      - name: Report governed credential availability only
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for pair in "TOKEN_A:GITLAB_TOKEN" "TOKEN_B:GITLAB_PAT" "TOKEN_C:GITLAB_ACCESS_TOKEN" "TOKEN_D:MUNDINHO_GITLAB_TOKEN" "TOKEN_E:GITLAB_API_TOKEN"; do
            var="${pair%%:*}"
            label="${pair#*:}"
            if [ -n "${!var:-}" ]; then
              echo "CANONICAL_GITLAB_CREDENTIAL=FOUND alias=$label"
              FOUND=1
              break
            fi
          done
          test "$FOUND" = "1" || { echo "CANONICAL_GITLAB_CREDENTIAL=MISSING"; exit 78; }
