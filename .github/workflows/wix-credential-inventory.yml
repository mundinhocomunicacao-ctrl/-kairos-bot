name: Wix Credential Presence Inventory
on:
  push:
    branches:
      - forge/wix-remote-release-auth-20260927
    paths:
      - '.github/workflows/wix-credential-inventory.yml'
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory governed credential aliases
        env:
          A1: ${{ secrets.WIX_API_KEY }}
          A2: ${{ secrets.WIX_CLI_API_KEY }}
          A3: ${{ secrets.WIX_RELEASE_API_KEY }}
          A4: ${{ secrets.WIX_MUNDO_API_KEY }}
          A5: ${{ secrets.MUNDINHO_WIX_API_KEY }}
          A6: ${{ secrets.WIX_ACCESS_TOKEN }}
          A7: ${{ secrets.WIX_TOKEN }}
          A8: ${{ secrets.WIX_CI_TOKEN }}
          A9: ${{ secrets.WIX_DEPLOY_TOKEN }}
          A10: ${{ secrets.MUNDINHO_WIX_TOKEN }}
          A11: ${{ secrets.MUNDO_WIX_API_KEY }}
          A12: ${{ secrets.WIX_ACCOUNT_API_KEY }}
        shell: bash
        run: |
          names=(WIX_API_KEY WIX_CLI_API_KEY WIX_RELEASE_API_KEY WIX_MUNDO_API_KEY MUNDINHO_WIX_API_KEY WIX_ACCESS_TOKEN WIX_TOKEN WIX_CI_TOKEN WIX_DEPLOY_TOKEN MUNDINHO_WIX_TOKEN MUNDO_WIX_API_KEY WIX_ACCOUNT_API_KEY)
          vals=("$A1" "$A2" "$A3" "$A4" "$A5" "$A6" "$A7" "$A8" "$A9" "$A10" "$A11" "$A12")
          found=0
          for i in "${!names[@]}"; do
            if [ -n "${vals[$i]}" ]; then
              echo "PRESENT:${names[$i]}"
              found=1
            else
              echo "ABSENT:${names[$i]}"
            fi
          done
          echo "ANY_PRESENT=$found"
