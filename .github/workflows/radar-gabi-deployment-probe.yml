name: Radar Gabi · Deployment Probe
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radar-gabi-deployment-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public and immutable Wix deployments
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            name="$1"
            url="$2"
            echo "=== $name ==="
            code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o "/tmp/$name.html" -w '%{http_code}' "$url" || true)"
            size="$(wc -c < "/tmp/$name.html" 2>/dev/null || echo 0)"
            echo "HTTP=$code SIZE=$size"
            for marker in 'GABI_RADAR_PUBLIC_SAFE_V3' 'DIVA Studio' 'data-diva-face="DIVA_GABI"' 'presented:68' 'whatsappApproached:8' 'mediaKitSent:4'; do
              if grep -F "$marker" "/tmp/$name.html" >/dev/null 2>&1; then
                echo "MARKER_PASS=$marker"
              else
                echo "MARKER_MISS=$marker"
              fi
            done
            head -c 180 "/tmp/$name.html" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/^/PREFIX=/'
            echo
          }
          probe public 'https://radar.gabi.mundinhocomunicacao.com/'
          probe v68 'https://ys4rut-instant-dugewxsuwtwa-mundinhocomunicaca-1412.wix-site-host.com/'
          probe v64 'https://tcgx3x-instant-dugewxsuwtwa-mundinhocomunicaca-1412.wix-site-host.com/'
          probe v60 'https://ch0ihr-instant-dugewxsuwtwa-mundinhocomunicaca-1412.wix-site-host.com/'
