name: Probe OS Wix credential
on:
  push:
    branches: ['probe/os-wix-credential-20260926']
    paths: ['.github/workflows/probe-os-wix-credential.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      WIX_MUNDO_API_KEY: ${{ secrets.WIX_MUNDO_API_KEY }}
      WIX_GABI_RADAR_API_KEY: ${{ secrets.WIX_GABI_RADAR_API_KEY }}
    steps:
      - name: Check governed credential presence
        shell: bash
        run: |
          if [ -n "${WIX_MUNDO_API_KEY:-}" ]; then echo "WIX_MUNDO_API_KEY=PRESENT"; exit 0; fi
          if [ -n "${WIX_GABI_RADAR_API_KEY:-}" ]; then echo "WIX_GABI_RADAR_API_KEY=PRESENT"; exit 0; fi
          echo "WIX_GOVERNED_KEY=ABSENT"
          exit 2
